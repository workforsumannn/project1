<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suman Snapchat Family - Promise Day ✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');

        :root {
            --snap-yellow: #FFFC00;
            --snap-blue: #00AEFF;
            --snap-purple: #9b51e0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: #FFFC00;
            background: linear-gradient(180deg, #FFFC00 0%, #ff9a9e 50%, #fbc2eb 100%);
            min-height: 100vh;
            overflow-x: hidden;
            color: #1a1a1a;
        }

        .mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background-color: #FFFC00;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            opacity: 0.15;
            filter: blur(100px);
        }

        .glass-premium {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }

        .avatar-aura {
            position: relative;
            padding: 8px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #FFFC00, #ff4d4d, #9b51e0, #00AEFF, #FFFC00);
            animation: rotateAura 4s linear infinite;
        }

        @keyframes rotateAura {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-pic-container {
            background: black;
            border-radius: 50%;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center; justify-content: center;
            border: 4px solid white;
            position: relative; z-index: 2;
        }

        .floating-heart {
            position: fixed;
            bottom: -50px;
            font-size: 20px;
            color: rgba(255, 59, 132, 0.6);
            pointer-events: none;
            z-index: 0;
            animation: floatUp linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .sparkle {
            position: absolute; pointer-events: none;
            animation: sparkleAnim 1s linear forwards;
        }

        @keyframes sparkleAnim {
            0% { transform: translate(0, 0) scale(0); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1); opacity: 0; }
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0,0,0,0.1); border-radius: 10px;
        }

        .chat-bubble {
            animation: slideIn 0.4s ease-out both;
            border-left: 4px solid #FFFC00;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        #adminSection {
            display: none;
        }
    </style>
</head>
<body class="p-4 flex flex-col items-center min-h-screen relative" onclick="handleGlobalClick()">

    <div class="mesh-bg"></div>
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Main Container -->
    <div class="z-20 w-full max-w-md flex flex-col items-center">
        
        <!-- Header -->
        <div class="w-full flex flex-col items-center text-center mt-6 mb-8">
            <div class="avatar-aura">
                <div class="profile-pic-container">
                    <i class="fab fa-snapchat text-5xl text-yellow-400"></i>
                </div>
            </div>
            <div class="mt-6 px-4">
                <h1 class="text-3xl font-extrabold text-black uppercase leading-tight tracking-[0.2em] mb-1 drop-shadow-sm">HAPPY PROMISE DAY</h1>
                <div class="flex flex-col items-center space-y-1 mt-2">
                    <div class="flex items-center space-x-2">
                        <span class="text-[10px] font-black text-black/50 tracking-widest uppercase">Snap: @ft.sumann</span>
                    </div>
                    <span class="text-[10px] font-extrabold text-gray-500 uppercase tracking-[0.3em] block">SUMAN SNAPCHAT FAMILY</span>
                </div>
            </div>
        </div>

        <!-- Interaction Card -->
        <div class="w-full glass-premium p-6 md:p-8 space-y-6 mb-8">
            <div class="text-center space-y-2">
                <h2 class="text-xl font-black text-gray-800">Send Your Promise... 🤞</h2>
                <p class="text-sm font-medium text-gray-600 leading-relaxed italic">"It will be saved forever!"</p>
            </div>

            <div class="flex flex-col space-y-4">
                <input type="text" id="nameInput" placeholder="Your Name..." 
                       class="w-full bg-white/70 border-2 border-transparent py-4 px-6 rounded-[25px] font-bold text-sm outline-none transition-all text-black shadow-inner focus:border-yellow-400">
                
                <textarea id="promiseInput" placeholder="Write a promise..." rows="2"
                          class="w-full bg-white/70 border-2 border-transparent py-4 px-6 rounded-[25px] font-bold text-sm outline-none transition-all text-black shadow-inner focus:border-yellow-400 resize-none"></textarea>

                <button id="sendBtn" onclick="handleFormSubmit()" class="w-full bg-black text-white py-4 rounded-[25px] font-black text-sm tracking-widest hover:bg-yellow-400 hover:text-black transition-all shadow-xl active:scale-95 flex items-center justify-center space-x-2">
                    <span id="btnText">SEND</span>
                    <i class="fas fa-paper-plane text-xs"></i>
                </button>
            </div>

            <div class="flex justify-center space-x-4 pt-4 border-t border-black/5">
                <a href="https://instagram.com/Sumannnuc" target="_blank" class="p-3 bg-white rounded-full border border-black/10 hover:scale-110 transition-transform"><i class="fab fa-instagram text-pink-600"></i></a>
                <a href="https://www.snapchat.com/add/ft.sumann" target="_blank" class="p-3 bg-white rounded-full border border-black/10 hover:scale-110 transition-transform"><i class="fab fa-snapchat-ghost text-yellow-500"></i></a>
            </div>
        </div>

        <!-- Hidden Wall -->
        <div id="adminSection" class="w-full glass-premium p-6 md:p-8 flex flex-col max-h-[500px] mb-10 overflow-hidden">
            <h4 class="text-[10px] font-black text-gray-500 uppercase tracking-[0.2em] mb-4 text-center flex items-center justify-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                <span>Admin View: Promise Wall</span>
            </h4>
            <div id="promiseList" class="flex-grow space-y-4 overflow-y-auto pr-2 custom-scrollbar flex flex-col">
                <!-- Data will load here -->
            </div>
        </div>

        <div class="z-10 mt-2 mb-10 text-center opacity-40 px-6">
            <p class="text-[10px] font-extrabold tracking-[0.3em] text-black uppercase leading-relaxed mb-4">
                Created for entertainment purposes only. Do not take seriously.
            </p>
            <button onclick="adminLogin()" class="text-[8px] font-bold text-black/50 uppercase tracking-widest hover:text-black transition-colors underline">
                Admin Portal
            </button>
        </div>
    </div>

    <!-- Notifications -->
    <div id="notif" class="fixed top-10 left-1/2 -translate-x-1/2 z-[200] bg-black text-yellow-400 px-8 py-3 rounded-full font-black text-xs tracking-widest shadow-2xl opacity-0 translate-y-[-20px] transition-all duration-500 text-center pointer-events-none">
        PROMISE SAVED! 🔒
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, deleteDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'suman-snap-fam-v4';

        let user = null;
        let isMusicPlaying = false;
        let isAdminActive = false;
        const bgMusic = new Audio('music.mp3'); 
        bgMusic.loop = true;

        window.handleGlobalClick = () => {
            if (!isMusicPlaying) {
                bgMusic.play().then(() => { isMusicPlaying = true; }).catch(e => {});
            }
        };

        function createFloatingHearts() {
            const container = document.getElementById('hearts-container');
            setInterval(() => {
                const heart = document.createElement('i');
                heart.className = 'fas fa-heart floating-heart';
                const startPos = Math.random() * 100;
                heart.style.left = startPos + 'vw';
                heart.style.animationDuration = (5 + Math.random() * 10) + 's';
                heart.style.fontSize = (10 + Math.random() * 20) + 'px';
                heart.style.opacity = 0.2 + Math.random() * 0.4;
                container.appendChild(heart);
                setTimeout(() => heart.remove(), 15000);
            }, 600);
        }
        createFloatingHearts();

        // Fix Admin Login Visibility
        window.adminLogin = () => {
            const pw = prompt("Enter Admin Password to view promises:");
            if (pw === "suman123") {
                isAdminActive = true;
                const section = document.getElementById('adminSection');
                section.style.setProperty('display', 'flex', 'important');
                loadPromises(); 
                showNotif("ADMIN VIEW ACTIVATED! 🔓");
                // Scroll to admin view
                section.scrollIntoView({ behavior: 'smooth' });
            } else if (pw !== null) {
                alert("Access Denied!");
            }
        };

        // Fix Form Submit & Wait for Save
        window.handleFormSubmit = async () => {
            const nameInput = document.getElementById('nameInput');
            const promiseInput = document.getElementById('promiseInput');
            const btnText = document.getElementById('btnText');
            
            const name = nameInput.value.trim();
            const text = promiseInput.value.trim();

            if(!name || !text) return;

            // Start music on click
            if (!isMusicPlaying) bgMusic.play().catch(() => {});

            // Loading state
            btnText.innerText = "SENDING...";
            document.getElementById('sendBtn').disabled = true;

            // Clipboard Copy
            const copyText = `${name}: ${text}`;
            try {
                const textArea = document.createElement("textarea");
                textArea.value = copyText;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
            } catch (err) { console.error("Clipboard failed", err); }

            // Ensure Auth is ready
            if (!user) {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(auth);
                    }
                    user = auth.currentUser;
                } catch (err) { console.error("Auth error", err); }
            }

            // Save to Firestore and AWAIT
            if (user) {
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'promises'), {
                        name: name,
                        text: text,
                        userId: user.uid,
                        timestamp: serverTimestamp()
                    });
                    
                    showNotif("PROMISE SAVED! 🔒");
                    spawnSparkles(window.innerWidth/2, window.innerHeight/2);
                    
                    // Small delay to let user see success
                    setTimeout(() => {
                        window.location.href = 'https://www.snapchat.com/add/ft.sumann';
                    }, 1500);
                    
                } catch (e) {
                    console.error("Firestore Save Error:", e);
                    btnText.innerText = "SEND";
                    document.getElementById('sendBtn').disabled = false;
                    alert("Error saving promise. Please try again.");
                }
            } else {
                alert("Authentication failed. Please refresh the page.");
                btnText.innerText = "SEND";
                document.getElementById('sendBtn').disabled = false;
            }
        };

        window.confirmDelete = async (docId) => {
            if(!isAdminActive) return;
            if(confirm("Are you sure you want to delete this promise?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'promises', docId));
                    showNotif("DELETED! 🗑️");
                } catch (e) { alert("Error deleting."); }
            }
        };

        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (err) { console.error(err); }
        };

        initAuth();
        onAuthStateChanged(auth, (u) => { user = u; });

        function loadPromises() {
            if (!isAdminActive) return;
            const promiseCollection = collection(db, 'artifacts', appId, 'public', 'data', 'promises');
            onSnapshot(promiseCollection, (snapshot) => {
                const list = document.getElementById('promiseList');
                list.innerHTML = '';
                const docs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Local sort
                docs.sort((a, b) => {
                    const timeA = a.timestamp?.seconds || 0;
                    const timeB = b.timestamp?.seconds || 0;
                    return timeB - timeA;
                });

                if(docs.length === 0) {
                    list.innerHTML = `<p class="text-xs text-center text-gray-400 py-10 italic">No promises yet.</p>`;
                }

                docs.forEach(data => {
                    const item = document.createElement('div');
                    item.className = "chat-bubble bg-white/80 p-4 rounded-[25px] rounded-tl-none shadow-sm border border-white/40 flex justify-between items-start";
                    item.innerHTML = `
                        <div class="flex-grow">
                            <div class="flex items-center space-x-2 mb-1">
                                <span class="text-[10px] font-black text-purple-600 uppercase tracking-widest">${data.name || 'Anonymous'}</span>
                            </div>
                            <p class="text-sm font-bold text-gray-800 text-left">${data.text}</p>
                        </div>
                        <button onclick="confirmDelete('${data.id}')" class="ml-2 text-red-400 opacity-50 hover:opacity-100 transition-opacity">
                            <i class="fas fa-trash-alt text-xs"></i>
                        </button>
                    `;
                    list.appendChild(item);
                });
            }, (err) => console.error("Snapshot error:", err));
        }

        function showNotif(msg) {
            const el = document.getElementById('notif');
            el.innerText = msg;
            el.style.opacity = '1'; el.style.transform = 'translate(-50%, 0)';
            setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translate(-50%, -20px)'; }, 4000);
        }

        function spawnSparkles(x, y) {
            for(let i=0; i<15; i++) {
                const s = document.createElement('div');
                s.className = 'sparkle';
                s.innerHTML = ['✨', '⭐', '💛', '🤞'][Math.floor(Math.random()*4)];
                s.style.left = x + 'px'; s.style.top = y + 'px';
                s.style.setProperty('--tx', (Math.random()-0.5)*300 + 'px');
                s.style.setProperty('--ty', (Math.random()-0.5)*300 + 'px');
                document.body.appendChild(s);
                setTimeout(() => s.remove(), 1000);
            }
        }
    </script>
</body>
</html>
